<title>Little Charm Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;700&display=swap">
<style>
/* Layout: filter chips, product grid, sticky order bar that builds a copyable order message */
:root{--bg:#fbf7f9;--card:#fff;--fg:#2b2230;--muted:#7a6e80;--accent:#b0336b;--line:#eadfe6;
--display:"Fraunces",Georgia,serif;--body:"Nunito Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b161d;--card:#251e28;--fg:#f3ecf5;--muted:#a99cb0;--accent:#ef7fb0;--line:#3a2f3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b161d;--card:#251e28;--fg:#f3ecf5;--muted:#a99cb0;--accent:#ef7fb0;--line:#3a2f3e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:16px 16px 140px}
main{max-width:960px;margin:0 auto;display:grid;gap:20px}
h1{font:600 2rem/1.1 var(--display);margin:8px 0 4px;text-wrap:balance}
p.sub{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 14px;border-radius:99px;font:inherit;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.sw{height:84px;border-radius:8px;display:grid;place-items:center;font:600 1.6rem var(--display);color:#fff}
.item h3{margin:0;font-size:1rem}
.meta{color:var(--muted);font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:700 1rem var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.total{font:600 1.3rem var(--display);font-variant-numeric:tabular-nums}
.cta{background:var(--accent);color:var(--bg);border:0;padding:10px 18px;border-radius:10px;font:700 1rem var(--body);cursor:pointer}
.cta:disabled{opacity:.4;cursor:default}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:14px/1.5 var(--body);padding:10px}
.note{font-size:.85rem;color:var(--muted)}
</style>

<main>
  <header>
    <h1>Little Charm Shop</h1>
    <p class="sub">Earrings, rings, clips and charms. Pick what you like, then copy your order and send it to us on WhatsApp or Instagram.</p>
  </header>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <section id="orderBox" hidden>
    <label for="msg"><strong>Your order message</strong></label>
    <textarea id="msg" readonly></textarea>
    <p class="note">Send this text to the shop. Free delivery on orders above ₹499.</p>
  </section>
</main>

<div class="bar"><div class="in">
  <div><div class="total" id="total">₹0</div><div class="note" id="count">No items yet</div></div>
  <button class="cta" id="copy" disabled>Copy order</button>
</div></div>

<script>
const items=[
 ["Pearl drop earrings","Earrings",149,"#c9a27e"],["Gold hoop earrings","Earrings",199,"#d4a52a"],
 ["Tiny star studs","Earrings",99,"#7b6cc4"],["Adjustable heart ring","Rings",129,"#d0567f"],
 ["Stackable ring set (5)","Rings",179,"#8a8f99"],["Butterfly hair clips (4)","Hair",89,"#4aa3a1"],
 ["Pastel claw clip","Hair",119,"#e39ab6"],["Scrunchie pack (3)","Hair",99,"#a46bd0"],
 ["Beaded phone charm","Charms",79,"#e07a3c"],["Cherry keychain","Charms",69,"#c0303a"],
 ["Name initial necklace","Necklaces",249,"#b8902f"],["Evil eye bracelet","Bracelets",99,"#2f6fc0"]
];
const cart={};let filter="All";
const cats=["All",...new Set(items.map(i=>i[1]))];
const $=id=>document.getElementById(id);
function renderChips(){$("chips").innerHTML=cats.map(c=>`<button aria-pressed="${c===filter}" data-c="${c}">${c}</button>`).join("")}
function renderGrid(){
 $("grid").innerHTML=items.map((it,i)=>[it,i]).filter(([it])=>filter==="All"||it[1]===filter).map(([[n,c,p,col],i])=>`
 <div class="item"><div class="sw" style="background:${col}">${n[0]}</div>
 <h3>${n}</h3><div class="meta">${c}</div>
 <div class="row"><span class="price">₹${p}</span>
 <span class="qty"><button data-i="${i}" data-d="-1" aria-label="Remove one ${n}">−</button><span>${cart[i]||0}</span><button data-i="${i}" data-d="1" aria-label="Add one ${n}">+</button></span></div></div>`).join("")}
function update(){
 const lines=Object.entries(cart).filter(([,q])=>q>0);
 const total=lines.reduce((s,[i,q])=>s+items[i][2]*q,0);
 const n=lines.reduce((s,[,q])=>s+q,0);
 $("total").textContent="₹"+total;
 $("count").textContent=n?`${n} item${n>1?"s":""}${total>=499?" · free delivery":" · add ₹"+(499-total)+" for free delivery"}`:"No items yet";
 $("copy").disabled=!n;$("orderBox").hidden=!n;
 $("msg").value="Hi! I'd like to order:\n"+lines.map(([i,q])=>`- ${items[i][0]} x${q} = ₹${items[i][2]*q}`).join("\n")+`\nTotal: ₹${total}\nName:\nAddress:`;
}
$("chips").onclick=e=>{const c=e.target.dataset.c;if(c){filter=c;renderChips();renderGrid()}};
$("grid").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=b.dataset.i;cart[i]=Math.max(0,(cart[i]||0)+ +b.dataset.d);renderGrid();update()};
$("copy").onclick=()=>{const t=$("msg");navigator.clipboard.writeText(t.value).then(()=>{$("copy").textContent="Copied"},()=>{t.select();$("copy").textContent="Select and copy"});setTimeout(()=>$("copy").textContent="Copy order",2000)};
renderChips();renderGrid();update();
</script>
